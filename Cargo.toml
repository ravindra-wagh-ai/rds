[package]
name = "rds"
version = "0.1.0"
edition = "2024"
authors =  ["Ravindra Wagh"]

[dependencies]
dotenvy = "0.15"
redis = { version = "1.4.1", features = ["tokio-comp", "connection-manager"] }
async-graphql = { version = "7.0", features = ["playground"] }
async-graphql-axum = "7.2.1"
axum = "0.8.9"
axum_rate_limiter = "0.1.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["postgres", "rust_decimal", "runtime-tokio"] }
serde_json = "1"
models = { path = "models" }